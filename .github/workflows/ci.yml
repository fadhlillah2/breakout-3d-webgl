name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Browser smoke (Chrome headless, preinstalled on ubuntu-latest)
        run: node tools/smoke.mjs
